[package]
name = "reflex"
version = "0.1.0"
edition.workspace = true
description = "Experimental no_std APIs for fifth-generation Sharp Brain apps"

[features]
experimental-runtime = []
experimental-peg = []

alloc = ["experimental-runtime"]
application = ["alloc", "experimental-peg", "dep:reflex-macros"]
storage = ["alloc", "dep:serde", "dep:serde_json", "dep:sha2"]
text = []
font-antialias = ["text"]
panic-screen = ["text"]
panic-qr = ["panic-screen", "dep:qrcodegen-no-heap"]

[dependencies]
serde = { version = "1.0", optional = true, default-features = false, features = ["derive", "alloc"] }
serde_json = { version = "1.0", optional = true, default-features = false, features = ["alloc"] }
sha2 = { version = "0.10", optional = true, default-features = false }
reflex-macros = { path = "../reflex-macros", optional = true }
qrcodegen-no-heap = { version = "1.8.1", optional = true, default-features = false }

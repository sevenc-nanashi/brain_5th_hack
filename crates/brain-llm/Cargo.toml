[package]
name = "brain-llm"
version = "0.1.0"
edition.workspace = true
[features]
device = ["reflex/application", "reflex/panic-qr"]
[dependencies]
reflex = { path = "../reflex", features = ["text"] }
libm = "0.2.16"
sha2 = { version = "0.10", default-features = false }
[[bin]]
name = "brain-llm"
required-features = ["device"]
[package.metadata.reflex]
name = "LLM"
output = "llm"
assets = ["LICENSE-LLAMA2.txt", "../reflex/assets/FONT-LICENSE.txt", "assets/LICENSE-ELAN.txt", "assets/ELAN-MODEL.txt", "assets/FONT-JAPANESE-LICENSE.txt"]
[[package.metadata.reflex.downloads]]
filename = "stories260K.bin"
url = "https://huggingface.co/karpathy/tinyllamas/resolve/0bd21da7698eaf29a0d7de3992de8a46ef624add/stories260K/stories260K.bin"
sha256 = "b0a507e7ad0f626624f17112325e66691f9076d622e1d3274d103d00299f2696"
[[package.metadata.reflex.downloads]]
filename = "tok512.bin"
url = "https://huggingface.co/karpathy/tinyllamas/resolve/0bd21da7698eaf29a0d7de3992de8a46ef624add/stories260K/tok512.bin"
sha256 = "037cb335abb25d1fa9e8ecae30ed2a3a8ace9302862ebcdc05d51a6bbb10c312"

[package.metadata.reflex.inputs]
directory = "llm"

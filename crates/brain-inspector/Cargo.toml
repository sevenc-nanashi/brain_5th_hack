[package]
name = "brain-inspector"
version = "0.1.0"
edition.workspace = true

[features]
device = ["reflex/experimental-peg", "reflex/experimental-runtime"]

[dependencies]
reflex = { path = "../reflex" }

[[bin]]
name = "brain-inspector"
required-features = ["device"]

[package.metadata.reflex]
name = "Inspector"
output = "inspector"
linker = "link.x"

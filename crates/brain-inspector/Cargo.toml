[package]
name = "brain-inspector"
version = "0.1.0"
edition.workspace = true

[features]
device = ["reflex/application", "reflex/panic-qr"]

[dependencies]
reflex = { path = "../reflex", features = ["text"] }

[[bin]]
name = "brain-inspector"
required-features = ["device"]

[package.metadata.reflex]
name = "Inspector"
output = "inspector"
linker = "../reflex/link.x"
assets = ["../reflex/assets/FONT-LICENSE.txt"]

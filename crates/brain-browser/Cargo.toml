[package]
name = "brain-browser"
version = "0.1.0"
edition.workspace = true
license = "GPL-2.0-only"

[features]
device = ["reflex/application", "reflex/panic-qr"]

[dependencies]
reflex = { path = "../reflex" }

[[bin]]
name = "brain-browser"
path = "src/main.rs"
required-features = ["device"]

[package.metadata.reflex]
name = "Browser"
output = "browser"

[package.metadata.reflex.inputs]
directory = "netsurf-inputs"
env = "NETSURF_INPUTS"
assets = ["LICENSES.txt"]

[package]
name = "brain-doom"
version = "0.1.0"
edition.workspace = true

[features]
engine = ["reflex/experimental-runtime"]
device = ["engine", "reflex/application"]

[dependencies]
reflex = { path = "../reflex" }

[[bin]]
name = "brain-doom"
path = "src/main.rs"
required-features = ["device"]

[[example]]
name = "preview"
required-features = ["engine"]

[package.metadata.reflex]
name = "Doom"
output = "doom"
assets = ["assets/FONT-LICENSE.txt"]

[package.metadata.reflex.inputs]
directory = "doom-inputs"
env = "DOOM_INPUTS"
assets = ["OPAL-LICENSE.txt"]

[package]
name = "brain-calculator"
version = "0.1.0"
edition.workspace = true

[features]
device = ["reflex/application"]

[dependencies]
reflex = { path = "../reflex", features = ["text", "panic-qr"] }
libm = "0.2.16"

[[bin]]
name = "brain-calculator"
required-features = ["device"]

[package.metadata.reflex]
name = "Calculator"
output = "calculator"
link-args = ["--no-undefined"]
assets = ["../reflex/assets/FONT-LICENSE.txt"]

[package]
name = "brain-hello-world"
version = "0.1.0"
edition.workspace = true

[features]
device = ["reflex/application"]

[[bin]]
name = "brain-hello-world"
path = "src/main.rs"
required-features = ["device"]

[dependencies]
reflex = { path = "../reflex" }

[package.metadata.reflex]
name = "HelloWorld"
output = "hello-world"
